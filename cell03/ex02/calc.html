<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Calculator</title>
    <link rel="stylesheet" href="calc.css">
</head>
<body>

    <div class="calculator">
        <input type="number" id="leftOperand" placeholder="Left Operand">

        <select id="operator">
            <option value="+">+</option>
            <option value="-">-</option>
            <option value="*">*</option>
            <option value="/">/</option>
            <option value="%">%</option>
        </select>

        <input type="number" id="rightOperand" placeholder="Right Operand">

        <input type="submit" value="Try me!" onclick="calculate()" />
    </div>

    <script src="calc.js"></script>

</body>
</html>
